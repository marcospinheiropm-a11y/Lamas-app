<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>Controle de Maturação Lamas</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Roboto,sans-serif}
:root{--me:#2A1F1A;--mm:#3D2B1F;--du:#D4B98C;--bg:#F5F0EA;--ro:#6A4BC4;--ve:#A82020;--vd:#2E7D32;--am:#ED6C02;--ci:#757575;--tx:#2C2C2C;--li:#E0D5C1;color-scheme:light only;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:40px}
button,input,select,textarea{font-size:16px}
button{color:var(--me)}
.cab{background:linear-gradient(135deg,var(--me),var(--mm));color:var(--bg);padding:20px 20px 42px;border-radius:0 0 20px 20px;box-shadow:0 4px 12px rgba(0,0,0,.2);position:relative;overflow:hidden}
.cab::after{content:"Coordenador de Maturação · Marcos A.P";position:absolute;left:20px;right:20px;bottom:12px;text-align:center;font-size:12px;line-height:1;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:rgba(212,185,140,.55);border-top:1px solid rgba(212,185,140,.18);padding-top:10px;pointer-events:none;user-select:none}
.cc{max-width:650px;margin:0 auto;position:relative;z-index:1}
.la{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.logo{width:52px;height:52px;background:var(--du);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px}
.titulo{font-size:22px;font-weight:700;color:var(--du);line-height:1.2}
.sub{font-size:14px;color:#E0D2B8}
.op{display:flex;align-items:center;gap:8px;margin:8px 0 14px;font-size:14px;color:#E0D2B8;cursor:pointer}
.dot{width:10px;height:10px;background:#4CAF50;border-radius:50%}
.bt{display:flex;gap:8px;flex-wrap:wrap}
.bh{padding:10px 14px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--du);background:transparent;color:var(--du)}
.bh.p{background:var(--du);color:var(--me);border:0}
.ct{max-width:650px;margin:18px auto 0;padding:0 15px}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin-bottom:12px}
.cm{background:#fff;padding:10px;border-radius:10px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.cm b{display:block;font-size:19px;color:var(--me)}.cm span{font-size:12px;color:#666}
.al{border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:14px}
.al.r{background:#EDE7F9;border:1px solid #CFC2EF;color:#4B33A0;cursor:pointer}
.al.a{background:#FFF3E0;border:1px solid #FFD9A8;color:#8A4B00}
.fx{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:8px}
.fl{display:flex;gap:8px;flex-wrap:wrap}
.fx select,.fx input,.in input,.mo input,.mo select,.mo textarea{padding:10px;border:1px solid var(--li);border-radius:8px;background:#fff;color:var(--tx);width:100%}
.fl select{flex:1;min-width:120px;width:auto}
.bc{background:#fff;border-radius:12px;padding:18px;margin-bottom:15px;border-left:6px solid var(--ro);box-shadow:0 2px 6px rgba(0,0,0,.05)}
.bp0{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.nt{background:var(--me);color:var(--du);font-weight:700;padding:4px 12px;border-radius:6px;font-size:16px}
.sb{padding:4px 10px;border-radius:12px;font-size:12px;font-weight:700;text-transform:uppercase}
.li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0}
.li .l{color:var(--ci)}.li .v{text-align:right}
.bf{height:12px;background:#EEE6D8;border-radius:6px;overflow:hidden;margin-top:10px}
.bf i{display:block;height:100%}
.bg{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.ba{padding:8px 11px;border-radius:7px;border:1px solid var(--li);background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:var(--me)}
.ba.d{background:var(--me);color:var(--du);border-color:var(--me)}.ba.x{color:var(--ve);border-color:#E8B9B9}
details{margin-top:12px;border-top:1px solid var(--li);padding-top:8px;font-size:13px}
summary{cursor:pointer;font-weight:600;color:var(--mm)}
.ci{padding:5px 0;border-bottom:1px dashed var(--li)}
.ov{position:fixed;inset:0;background:rgba(30,20,14,.65);display:flex;align-items:flex-end;justify-content:center;z-index:9;padding-top:env(safe-area-inset-top,0px)}
.mo{background:#fff;width:100%;max-width:560px;max-height:calc(100vh - 110px);max-height:calc(100dvh - 110px - env(safe-area-inset-top,0px));overflow:auto;border-radius:18px 18px 0 0;padding:0 16px 16px;border-top:6px solid var(--mm)}
@media(min-width:700px){.ov{align-items:center}.mo{border-radius:14px;max-height:90vh}}
.mb{position:sticky;top:0;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--li);margin-bottom:8px}
.mb h2{font-size:19px;color:var(--mm)}
.mf{position:sticky;bottom:0;background:#fff;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));margin-top:12px;border-top:1px solid var(--li)}
.mo label{display:block;margin:10px 0 4px;font-size:13px;font-weight:700;color:var(--mm)}
.bpr{padding:11px 16px;border-radius:8px;border:0;background:var(--me);color:var(--du);font-weight:700;cursor:pointer;width:100%}
.bpr.pe{background:var(--ve);color:#fff}
.bs{padding:8px 12px;border-radius:7px;border:1px solid var(--li);background:#fff;color:var(--me);font-weight:600;cursor:pointer}
.er{color:var(--ve);font-weight:700;font-size:14px;margin:8px 0}
.rb{background:var(--bg);border-radius:10px;padding:10px;margin-bottom:8px;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#t{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--me);color:var(--du);padding:10px 18px;border-radius:24px;z-index:20;display:none;max-width:90vw;font-size:14px}
.vz{padding:30px;text-align:center;color:#666}
</style>
</head>
<body>
<header class="cab"><div class="cc">
  <div class="la"><div class="logo">🥃</div><div><div class="titulo">Controle de Maturação Lamas</div><div class="sub">Adega Artesanal</div></div></div>
  <div class="op" id="op"></div>
  <div class="bt">
    <button class="bh p" data-a="novo">+ Novo Barril</button>
    <button class="bh" data-a="lote">Gerar Lote</button>
    <button class="bh" data-a="rel">📊 Totais por Bebida</button>
    <button class="bh" data-a="lix" id="blix"></button>
    <button class="bh" data-a="bkp">Backup</button>
    <button class="bh" data-a="estq">Estoque de garrafas</button>
    <button class="bh" data-a="cont">Movimentação (contabilidade)</button>
  </div>
</div></header>
<div class="ct">
  <div class="mg" id="met"></div>
  <div id="al"></div>
  <div class="fx">
    <input id="q" placeholder="Buscar por nº, madeira ou bebida…">
    <div class="fl"><select id="fb"></select><select id="fm"></select>
      <select id="fs"><option value="">Todos os status</option><option>Cheio</option><option>Parcial</option><option>Vazio</option><option>Pronto</option><option>Manutenção</option><option>Estragado</option></select></div>
  </div>
  <div id="cnt" style="margin-bottom:10px;font-size:14px;color:var(--mm)"></div>
  <div id="lista"></div>
</div>
<div id="m"></div><div id="t" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const LS=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const hoje=()=>{const d=new Date(),p=x=>String(x).padStart(2,"0");return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()};
const pd=s=>{const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec((s||"").trim());if(!m)return null;const[,d,mo,a]=m.map(Number),x=new Date(a,mo-1,d);return x.getFullYear()==a&&x.getMonth()==mo-1&&x.getDate()==d?x.getTime():null};
const mask=v=>{const d=v.replace(/\D/g,"").slice(0,8);return d.length>4?d.slice(0,2)+"/"+d.slice(2,4)+"/"+d.slice(4):d.length>2?d.slice(0,2)+"/"+d.slice(2):d};
const L=c=>(c/100).toLocaleString("pt-BR",{maximumFractionDigits:2})+" L";
const toCl=s=>{const n=parseFloat(String(s).replace(",","."));return isFinite(n)?Math.round(n*100):NaN};
const fd=t=>new Date(t).toLocaleDateString("pt-BR");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DM=["Carvalho Americano","Carvalho Francês","Bálsamo","Amburana","Jequitibá Rosa","Seis Madeiras","Pau Brasil","Sassafrás","Putumuju","Ipê","Eucalipto","Grápia","Castanheira","Angico","Cumaru"];
const DB=["Whisky Lamas","Whisky Bourbon","Whisky B","Whisky U","Whisky Turfado","Extrato de Carvalho","Cachaça","Rum"];
const COR={Cheio:"#2E7D32",Parcial:"#ED6C02",Vazio:"#A82020",Pronto:"#6A4BC4",Estragado:"#333333",Manutenção:"#546E7A"};
const ME="marcos@exemplo.com";
const mk=(n,mad,beb,cap,v,enc,me,ai,aa)=>{const b={id:uid(),n,mad,beb,cap,m:[],enc,meses:me,abvI:ai,abvA:aa,obs:"",est:false,man:false,ex:false};if(v>0)b.m.push({id:uid(),t:"inicial",d:enc,ts:pd(enc),dl:v,o:"Saldo inicial",p:ME,em:0});return b};
let B=LS("lb3")||[mk("BAR-001","Carvalho Americano","Whisky Bourbon",20000,18500,"10/01/2024",24,40,40),mk("BAR-002","Jequitibá Rosa","Whisky Lamas 2 anos",20000,18000,"20/02/2025",36,55,52),mk("BAR-003","Bálsamo","",20000,0,"05/03/2025",12,"",""),mk("BAR-004","Amburana","Cachaça",10000,10000,"01/11/2024",24,48,48)];
let OP=LS("lb3op")||"",PW=LS("lb3pw"),NX=null,MV=null,ED=null;
let E=LS("lb3e")||[];
B=B.filter(b=>!b.ex||Date.now()-(b.exTs||0)<30*864e5);
const save=()=>SV("lb3",B);
const get=id=>B.find(b=>b.id==id);
const vol=b=>b.m.reduce((s,x)=>s+x.dl,0);
const pi=b=>{const i=pd(b.enc),n=+b.meses;if(i===null||!(n>0))return{};const d=new Date(i);d.setMonth(d.getMonth()+Math.round(n));const e=d.getTime(),dias=Math.ceil((e-Date.now())/864e5);return{e,dias,ok:dias<=0}};
const st=b=>b.est?"Estragado":b.man?"Manutenção":vol(b)<=0?"Vazio":pi(b).ok?"Pronto":vol(b)>=b.cap?"Cheio":"Parcial";
const addM=(b,t,dl,o,d)=>{const dd=d||hoje();b.m.push({id:uid(),t,d:dd,ts:pd(dd),dl,o:o||"",p:OP,em:Date.now()})};
const TX={inicial:"Saldo inicial",entrada:"Entrada",saida:"Saída",zerou:"ZEROU",ajuste:"Ajuste",estado:"Status",tanoeiro:"Tanoeiro / reforma",perda:"Perda (evaporação)",teor:"Teor alcoólico",engarrafamento:"Engarrafamento"};
const TIPOS=Object.keys(TX);
function toast(t){const e=$("#t");e.textContent=t;e.style.display="block";clearTimeout(toast.i);toast.i=setTimeout(()=>e.style.display="none",2600)}
function M(t,h,fixo){$("#m").innerHTML=`<div class="ov" data-a="bg"><div class="mo" role="dialog"><div class="mb"><h2>${t}</h2>${fixo?"":`<button class="bs" data-a="x" aria-label="Fechar">✕</button>`}</div>${h}${fixo?"":`<div class="mf"><button class="bs" style="width:100%" data-a="x">← Voltar</button></div>`}</div></div>`}
const X=()=>{$("#m").innerHTML=""};
const ER=t=>{$("#f_e").textContent=t};
function lst(a,b){return [...new Set([...a,...b].filter(Boolean))].sort((x,y)=>x.localeCompare(y,"pt-BR"))}
function dl(id,a){return `<datalist id="${id}">${a.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`}
function fill(sel,lb,o,cur){const e=$(sel);e.innerHTML=`<option value="">${lb}</option>`+o.map(x=>`<option>${esc(x)}</option>`).join("");e.value=cur}

function draw(){
  const at=B.filter(b=>!b.ex),q=$("#q").value.trim().toLowerCase(),fs=$("#fs").value,fb=$("#fb").value,fm=$("#fm").value;
  fill("#fb","Todas as bebidas",lst([],at.map(b=>b.beb)),fb);fill("#fm","Todas as madeiras",lst([],at.map(b=>b.mad)),fm);
  const c={Cheio:0,Parcial:0,Vazio:0,Pronto:0,Manutenção:0,Estragado:0};let lit=0;
  at.forEach(b=>{c[st(b)]++;if(!b.est)lit+=Math.max(0,vol(b))});
  $("#met").innerHTML=[["Total",at.length],["Cheios",c.Cheio],["Parciais",c.Parcial],["Vazios",c.Vazio],["Prontos",c.Pronto],["Manutenção",c.Manutenção],["Estragados",c.Estragado],["Em maturação",L(lit)]].map(([l,v])=>`<div class="cm"><b>${v}</b><span>${l}</span></div>`).join("");
  $("#blix").textContent="Lixeira ("+(B.length-at.length)+")";
  $("#op").innerHTML=`<i class="dot"></i>Operador: <b>${esc(OP||"—")}</b> <u>trocar</u>`;
  const pr=at.filter(b=>st(b)=="Pronto"),px=at.filter(b=>{const i=pi(b);return !b.est&&!b.man&&vol(b)>0&&i.e&&i.dias>0&&i.dias<=30}).sort((a,b)=>pi(a).dias-pi(b).dias);
  $("#al").innerHTML=(pr.length?`<div class="al r" data-a="fpro"><b>🔔 ${pr.length} ${pr.length==1?"barril pronto":"barris prontos"} (maturação completa):</b> ${pr.map(b=>esc(b.n)).join(", ")}<br><small>Toque para filtrar.</small></div>`:"")+(px.length?`<div class="al a">⏳ Ficam prontos em até 30 dias: ${px.map(b=>esc(b.n)+" ("+pi(b).dias+" dias)").join(", ")}</div>`:"");
  const l=at.filter(b=>(!q||b.n.toLowerCase().includes(q)||b.mad.toLowerCase().includes(q)||b.beb.toLowerCase().includes(q))&&(!fs||st(b)==fs)&&(!fb||b.beb==fb)&&(!fm||b.mad==fm)).sort((a,b)=>a.n.localeCompare(b.n,"pt-BR",{numeric:true}));
  const sf=l.filter(b=>!b.est).reduce((s,b)=>s+Math.max(0,vol(b)),0);
  $("#cnt").innerHTML=`${l.length} de ${at.length} barris · <b>Soma dos filtrados: ${L(sf)}</b>`;
  $("#lista").innerHTML=l.map(card).join("")||`<div class="vz">Nenhum barril encontrado com esses filtros.</div>`;
}
function card(b){
  const s=st(b),v=Math.max(0,vol(b)),p=Math.min(100,Math.round(v/b.cap*100)),c=COR[s],i=pi(b),id=b.id;
  const mv=[...b.m].sort((x,y)=>(y.ts||0)-(x.ts||0)||(y.em||0)-(x.em||0)),u=mv[0];
  const mat=i.e?(i.ok?`Pronto desde ${fd(i.e)}`:`Pronto em ${fd(i.e)} (faltam ${i.dias} dias)`):"Sem prazo definido";
  const cad=mv.map(m=>`<div class="ci"><b>${esc(m.d)}</b> — ${TX[m.t]||m.t}${m.dl?" "+L(Math.abs(m.dl)):""}${m.o?" · "+esc(m.o):""} <small style="color:#888">(${esc(m.p||"Anônimo")})</small></div>`).join("");
  return `<div class="bc" style="border-left-color:${c}">
  <div class="bp0"><span class="nt">${esc(b.n)}</span><span class="sb" style="background:${s=="Estragado"?"#333":c+"22"};color:${s=="Estragado"?"#fff":c}">${s}</span></div>
  <div class="li"><span class="l">Madeira:</span><span class="v">${esc(b.mad)}</span></div>
  <div class="li"><span class="l">Conteúdo:</span><span class="v" style="font-weight:700;color:var(--me)">${esc(b.beb||"Vazio")}</span></div>
  <div class="li"><span class="l">Teor alcoólico:</span><span class="v">Ini: ${b.abvI||"--"}% | Atu: ${b.abvA||"--"}%</span></div>
  ${b.tosta?`<div class="li"><span class="l">Tosta:</span><span class="v">${esc(b.tosta)}</span></div>`:""}${(()=>{const tn=(+b.tanoAnt||0)+b.m.filter(x=>x.t=="tanoeiro").length;return tn?`<div class="li"><span class="l">Tanoeiro/reforma:</span><span class="v">${tn} ${tn==1?"vez":"vezes"}</span></div>`:""})()}
  ${b.gal||b.prat?`<div class="li"><span class="l">Local:</span><span class="v">${esc([b.gal,b.prat].filter(Boolean).join(" · "))}</span></div>`:""}${+b.abvA>0&&vol(b)>0?`<div class="li"><span class="l">Álcool puro:</span><span class="v">${(vol(b)/100*b.abvA/100).toLocaleString("pt-BR",{maximumFractionDigits:2})} L</span></div>`:""}${(()=>{const pe=b.m.filter(x=>x.t=="perda").reduce((s,x)=>s-x.dl,0),en=b.m.filter(x=>x.t=="inicial"||x.t=="entrada").reduce((s,x)=>s+x.dl,0);return pe>0?`<div class="li"><span class="l">Perda (evaporação):</span><span class="v">${L(pe)}${en>0?" ("+(pe/en*100).toFixed(1).replace(".",",")+"%)":""}</span></div>`:""})()}
  <div class="li"><span class="l">Maturação:</span><span class="v" style="color:${i.ok?"var(--ro)":"inherit"};font-weight:${i.ok?700:400}">${b.meses||0} meses · ${mat}</span></div>
  <div class="li"><span class="l">Último lançamento:</span><span class="v">${u?esc(u.d)+" por "+esc(u.p||"—"):"—"}</span></div>
  ${b.obs?`<div class="li"><span class="l">Obs.:</span><span class="v"><i>${esc(b.obs)}</i></span></div>`:""}
  <div class="bf"><i style="width:${p}%;background:${c}"></i></div>
  <div style="font-size:12px;color:#666;text-align:right">${L(v)} de ${L(b.cap)} (${p}%)</div>
  <div class="bg">
    <button class="ba" data-a="mov" data-t="ent" data-id="${id}">Entrada</button>
    <button class="ba" data-a="mov" data-t="sai" data-id="${id}">Saída</button>
    <button class="ba d" data-a="mov" data-t="zer" data-id="${id}">Zerou Barril</button>
    <button class="ba" data-a="tan" data-id="${id}">🔧 Tanoeiro</button>
    <button class="ba" data-a="op" data-t="eng" data-id="${id}">Engarrafar</button><button class="ba" data-a="op" data-t="afe" data-id="${id}">Aferir nível</button><button class="ba" data-a="op" data-t="teo" data-id="${id}">Teor %</button>
    <button class="ba" data-a="man" data-id="${id}">${b.man?"Tirar manutenção":"Manutenção"}</button>
    <button class="ba x" data-a="est" data-id="${id}">${b.est?"Desmarcar estragado":"Estragado"}</button>
    <button class="ba" data-a="edit" data-id="${id}">✏️ Editar</button>
    <button class="ba x" data-a="del" data-id="${id}">Excluir</button>
  </div>
  <details><summary>📋 Caderno de movimentações (${b.m.length})</summary>${cad||"<div class='ci'>Nenhum lançamento.</div>"}</details></div>`;
}
function movF(id,t){
  const b=get(id);MV={id,t};const v=Math.max(0,vol(b));
  M({ent:"Entrada de líquido",sai:"Saída de líquido",zer:"Zerar barril"}[t]+" — "+esc(b.n),`<div class="rb">Volume atual: <b>${L(v)}</b> de ${L(b.cap)}</div>
  <label>Data (DD/MM/AAAA)</label><input id="f_d" inputmode="numeric" maxlength="10" value="${hoje()}">
  ${t=="zer"?`<p style="margin-top:10px">O barril será esvaziado (${L(v)}).</p>`:`<label>Litros</label><input id="f_l" inputmode="decimal">`}
  <label>Observação (opcional)</label><input id="f_o"><div class="er" id="f_e"></div><button class="bpr" data-a="okmov">Confirmar</button>`);
}
function okMov(){
  const b=get(MV.id),t=MV.t,d=$("#f_d").value,v=Math.max(0,vol(b));
  if(pd(d)===null)return ER("Data inválida. Use DD/MM/AAAA.");
  const o=$("#f_o").value.trim();
  if(t=="zer"){if(v<=0)return ER("Este barril já está vazio.");addM(b,"zerou",-v,o,d)}
  else{const c=toCl($("#f_l").value);if(!(c>0))return ER("Informe os litros (maior que zero).");
    if(t=="ent"){if(v+c>b.cap)return ER("Excede a capacidade. Cabem mais "+L(b.cap-v)+".");addM(b,"entrada",c,o,d);if(v==0)b.enc=d}
    else{if(c>v)return ER("Saída maior que o volume atual ("+L(v)+").");addM(b,"saida",-c,o,d)}}
  save();X();draw();toast("Movimentação lançada.");
}
function flag(id,k,on,off){const b=get(id);b[k]=!b[k];addM(b,"estado",0,b[k]?on:off);save();draw();toast(b[k]?on:off)}
function barF(id){
  const b=id?get(id):null;ED=id;

  const i=pd($("#f_d").value),f0=pd($("#f_en").value);if(i===null||f0===null)return ER("Datas inválidas. Use DD/MM/AAAA.");const f=f0+86399999;if(f<i)return ER("A data final deve ser depois da inicial.");ER("");

    b.m.forEach(m=>{const t=m.ts||0,d=m.dl||0;if(t<i)r.i+=d;if(t<=f)bf+=d;if(t>=i&&t<=f){if(m.t=="inicial"||m.t=="entrada")r.en+=d;else if(m.t=="saida"||m.t=="zerou")r.sa-=d;else if(m.t=="engarrafamento")r.eg-=d;else if(m.t=="perda")r.pe-=d;else if(m.t=="ajuste")r.aj+=d}});
    r.fm+=bf;if(+b.abvA>0)r.lap+=bf/100*b.abvA/100});
  const ln=Object.values(g).filter(r=>r.i||r.en||r.sa||r.eg||r.pe||r.aj||r.fm).sort((a,b)=>a.b.localeCompare(b.b,"pt-BR"));
  const ga=E.map(e=>{let a=0,en=0,sa=0,fm=0;e.m.forEach(m=>{const t=m.ts||0;if(t<i)a+=m.dl;if(t<=f)fm+=m.dl;if(t>=i&&t<=f){if(m.dl>0)en+=m.dl;else sa-=m.dl}});return{p:e.produto+" ("+e.ml+" ml)",a,en,sa,fm}}).filter(x=>x.a||x.en||x.sa||x.fm);
  window.CR={ln,ga,i:$("#f_d").value,f:$("#f_en").value};
  $("#cr").innerHTML=`<div style="display:flex;gap:8px;margin:10px 0"><button class="bs" data-a="ccsv">Exportar CSV</button><button class="bs" data-a="ccop">Copiar em texto</button></div>`+(ln.map(r=>`<div class="rb"><b style="color:var(--mm)">${esc(r.b)}</b><br>Inicial: ${L(r.i)} · Entradas: ${L(r.en)} · Saídas: ${L(r.sa)}<br>Engarrafado: ${L(r.eg)} · Perdas: ${L(r.pe)} · Ajustes: ${L(r.aj)}<br><b>Final: ${L(r.fm)}</b>${r.lap>0?" · Álcool puro: "+r.lap.toLocaleString("pt-BR",{maximumFractionDigits:2})+" L":""}</div>`).join("")||"<p>Sem movimentações no período.</p>")+(ga.length?`<div class="rb"><b style="color:var(--mm)">Garrafas</b>${ga.map(x=>`<br>${esc(x.p)}: inicial ${x.a} · entradas ${x.en} · saídas ${x.sa} · <b>final ${x.fm}</b>`).join("")}</div>`:"");
}
function cCsv(){const {ln,ga,i,f}=window.CR,n=c=>String(c/100).replace(".",","),r=[["Bebida","Saldo inicial (L)","Entradas (L)","Saidas (L)","Engarrafado (L)","Perdas evaporacao (L)","Ajustes (L)","Saldo final (L)","Alcool puro final (L)"]];ln.forEach(x=>r.push([x.b,n(x.i),n(x.en),n(x.sa),n(x.eg),n(x.pe),n(x.aj),n(x.fm),String(Math.round(x.lap*100)/100).replace(".",",")]));if(ga.length){r.push([],["Produto (garrafas)","Inicial","Entradas","Saidas","Final"]);ga.forEach(x=>r.push([x.p,x.a,x.en,x.sa,x.fm]))}dlf("movimentacao-"+i.replace(/\//g,"-")+"_a_"+f.replace(/\//g,"-")+".csv","\uFEFF"+r.map(l=>l.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\r\n"),"text/csv;charset=utf-8")}
async function cCop(){const {ln,ga,i,f}=window.CR,tx="MOVIMENTAÇÃO DE "+i+" A "+f+" (litros)\n\n"+ln.map(x=>x.b+"\n  Inicial "+L(x.i)+" | Entradas "+L(x.en)+" | Saídas "+L(x.sa)+" | Engarrafado "+L(x.eg)+" | Perdas "+L(x.pe)+" | Ajustes "+L(x.aj)+" | Final "+L(x.fm)).join("\n\n")+(ga.length?"\n\nGARRAFAS\n"+ga.map(x=>x.p+": inicial "+x.a+" | entradas "+x.en+" | saídas "+x.sa+" | final "+x.fm).join("\n"):"");try{await navigator.clipboard.writeText(tx);toast("Relatório copiado.")}catch(e){toast("Não foi possível copiar.")}}
function quem(){M("Quem está usando?",`<p>Seu nome ou e-mail fica registrado em cada lançamento.</p><label>Nome / e-mail</label><input id="f_q" value="${esc(OP)}"><div class="er" id="f_e"></div><button class="bpr" data-a="okq">Continuar</button>`,!OP)}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-a]");if(!t){if(e.target.closest("#op"))quem();return}
  const a=t.dataset.a,id=t.dataset.id;
  if(a=="bg"){if(e.target===t&&OP)X();return}
  const R={
    x:X,novo:()=>barF(),lote:loteF,rel:relat,bkp,lix,fpro:()=>{$("#fs").value="Pronto";draw()},
    mov:()=>movF(id,t.dataset.t),okmov:okMov,tan:()=>tanF(id),oktan:okTan,op:()=>opF(id,t.dataset.t),okop:okOp,estq:()=>estF(),estsel:()=>estF(id),estlan:estLan,cont:contF,gcont:gCont,ccsv:cCsv,ccop:cCop,man:()=>flag(id,"man","Colocado em MANUTENÇÃO","Saiu da manutenção"),est:()=>flag(id,"est","Marcado como ESTRAGADO","Marca de estragado removida"),
    edit:()=>barF(id),oked:okEd,oklote:okLote,pwset:pwSet,pwok:pwOk,
    del:()=>{const b=get(id);askPw(()=>{b.ex=true;b.exTs=Date.now();b.exBy=OP;save();draw();toast("Barril "+b.n+" movido para a lixeira.")},"Mover o barril "+esc(b.n)+" para a lixeira? Dá para restaurar por 30 dias.")},
    rest:()=>{const b=get(id);if(B.some(x=>!x.ex&&x.n==b.n))return toast("Já existe um barril "+b.n+" ativo.");b.ex=false;save();draw();lix();toast("Barril restaurado.")},
    apg:()=>{const b=get(id);askPw(()=>{B=B.filter(x=>x.id!=id);save();draw();lix();toast("Apagado definitivamente.")},"Apagar DEFINITIVAMENTE o barril "+esc(b.n)+"? Não dá para recuperar.")},
    okq:()=>{const v=$("#f_q").value.trim();if(!v)return ER("Informe seu nome ou e-mail.");OP=v;SV("lb3op",OP);X();draw()},
    bdl:()=>{dlf("backup-barris-lamas-"+hoje().replace(/\//g,"-")+".json",JSON.stringify({app:"controle-lamas",barris:B,estoque:E},null,1),"application/json")},
    brs:()=>{const d=window.BP;SV("lb3pre",{em:Date.now(),barris:B,estoque:E});d.forEach(n=>{const i=B.findIndex(x=>x.id==n.id);if(i>-1)B[i]=n;else B.push(n)});(window.BE||[]).forEach(n=>{const i=E.findIndex(x=>x.id==n.id);if(i>-1)E[i]=n;else E.push(n)});SV2();save();X();draw();toast(d.length+" barris restaurados. A cópia anterior foi guardada.")},undo:()=>{const p=LS("lb3pre");if(!p)return;B=p.barris;E=p.estoque||E;SV2();save();try{localStorage.removeItem("lb3pre")}catch(e){}X();draw();toast("Restauração desfeita.")},
    csv:()=>{const {g,ks}=window.RL,f=n=>String(n/100).replace(".",","),r=[["Bebida","Madeira","Volume (L)","Barris"]];ks.forEach(k=>Object.keys(g[k].m).forEach(m=>r.push([k,m,f(g[k].m[m]),g[k].n.join(" ")])));dlf("totais-por-bebida.csv","\uFEFF"+r.map(l=>l.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\r\n"),"text/csv;charset=utf-8")},
    cop:async()=>{const {g,ks,tot}=window.RL,tx="TOTAIS POR BEBIDA ("+hoje()+")\n\n"+ks.map(k=>k+" — "+L(g[k].t)+"\n  Barris: "+g[k].n.join(", ")).join("\n\n")+"\n\nTOTAL: "+L(tot);try{await navigator.clipboard.writeText(tx);toast("Tabela copiada.")}catch(er){toast("Não foi possível copiar.")}}
  };
  if(R[a])R[a]();
});
document.addEventListener("input",e=>{const i=e.target.id;if(i=="f_d"||i=="f_en")e.target.value=mask(e.target.value);if(["q","fb","fm","fs"].includes(i))draw()});
document.addEventListener("change",e=>{if(e.target.id!="bf")return;const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>prevBkp(r.result);r.readAsText(f)});
document.addEventListener("keydown",e=>{if(e.key=="Escape"&&OP)X()});
draw();if(!OP)quem();
</script>
